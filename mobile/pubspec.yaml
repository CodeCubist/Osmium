name: osmium_mobile
description: "Osmium Mobile - Ultra-low-latency remote desktop client."
publish_to: 'none'
version: 1.1.1+5

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_miuix: ^1.4.0
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  webview_flutter: ^4.10.0
  file_picker: ^9.0.2
  path_provider: ^2.1.5
  wakelock_plus: ^1.2.10
  ffi: ^2.1.4
  permission_handler: ^11.4.0
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/osmium_logo.png
    - assets/icons/google.svg
    - assets/icons/qq.svg
    - assets/icons/wechat.svg

  fonts:
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MiSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MiSans-Semibold.ttf
          weight: 600
        - asset: assets/fonts/MiSans-Bold.ttf
          weight: 700
