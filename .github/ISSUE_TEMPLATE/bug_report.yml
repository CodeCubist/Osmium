name: 软件缺陷报告 (Bug Report)
description: 提交软件运行过程中出现的异常、崩溃或错误
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### 提交须知
        在提交缺陷报告前，请务必检索现有的 [Issues](https://github.com/CodeCubist/Osmium/issues) 列表，以避免提交重复的问题

  - type: checkboxes
    id: pre_checks
    attributes:
      label: 前置确认 (Prerequisites)
      description: 提交前请确认以下各项均已满足
      options:
        - label: 已检索现有 Issues，确认此问题未被报告过
          required: true
        - label: 当前使用的 Osmium 为最新版本
          required: true

  - type: textarea
    id: bug_description
    attributes:
      label: 问题描述 (Description)
      description: 请准确客观地描述发生的异常情况
      placeholder: 例如：发起远程连接后画面黑屏无输出，或在结束串流后音频未恢复正常
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: 操作过程 (Steps to Reproduce)
      description: |
        **重要提示：请提供详尽的步骤说明**
        **开发者必须能够根据提供的步骤稳定复现此问题，方可进行有效的排查与修复。若问题无法复现，该报告可能被标记为无法处理**
      placeholder: |
        1. 启动 Osmium。
        2. 导航至 [...] 页面。
        3. 执行 [...] 操作。
        4. 观察到 [...] 异常现象。
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: 预期行为 (Expected Behavior)
      description: 描述在此操作下程序应有的正常表现
      placeholder: 例如：点击连接后应正常建立 P2P 会话并流畅显示远端画面
    validations:
      required: false

  - type: dropdown
    id: component_role
    attributes:
      label: 涉及模块 / 端侧 (Component / Role)
      description: 选择问题发生时涉及的端侧或模块
      options:
        - 主控端 (Controller)
        - 被控端 (Host)
        - 连接握手 / 信令与网络 (Connection & Signaling)
        - 账号与多设备管理 (Account & Devices)
        - 手柄映射与虚拟外设驱动 (Gamepad & Drivers)
        - 其他 (Other)
    validations:
      required: true

  - type: input
    id: software_version
    attributes:
      label: 软件版本 (Software Version)
      description: 提供触发此问题时的 Osmium 完整版本号
      placeholder: 例如：v1.1.2
    validations:
      required: true

  - type: input
    id: system_os
    attributes:
      label: 操作系统 (Operating System)
      description: 提供运行该程序的操作系统版本及构建号
      placeholder: 例如：Windows 11 24H2 (OS Build 26100)
    validations:
      required: true

  - type: textarea
    id: logs_and_screenshots
    attributes:
      label: "附加文件 (Attachments: Logs & Screenshots)"
      description: |
        请在此处上传相关错误截图及日志以协助定位问题（请先隐藏敏感信息）
        可直接拖拽文件至此区域。日志通常位于 `%LocalAppData%\Osmium\logs\`（便携模式下为程序目录下的 `OsmiumData\logs\`）
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: 补充信息 (Additional Context)
      description: 提供任何有助于排查该问题的额外环境信息（如：显卡型号、编解码设置、网络 NAT 类型、杀毒软件拦截记录等）
    validations:
      required: false
