name: Build and Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osmium-build-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_CONFIGURATION: Release
  FFMPEG_DOWNLOAD_URL: https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          sha="${GITHUB_SHA}"
          short_sha="${sha:0:7}"

          version=""
          if [ -f "Osmium.Installer/setup.iss" ]; then
            version=$(tr -d '\r' < Osmium.Installer/setup.iss | grep -E '^#define[[:space:]]+AppVersion[[:space:]]+"' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          fi
          if [ -z "$version" ] && [ -f "src/Osmium.App/Osmium.App.csproj" ]; then
            version=$(tr -d '\r' < src/Osmium.App/Osmium.App.csproj | grep -E '<Version>[^<]+</Version>' | head -n 1 | sed -E 's/.*<Version>([^<]+)<\/Version>.*/\1/' || true)
          fi
          if [ -z "$version" ]; then
            version="1.0.0"
          fi
          version="${version#v}"

          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "::notice::Osmium commit: ${sha} (${short_sha}), version: v${version}"

  build-native:
    name: Build OsmiumEngine
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare FFmpeg runtime DLLs
        shell: pwsh
        run: |
          $binDir = "native\deps\ffmpeg\bin"
          $required = @("avcodec-63.dll", "avutil-61.dll", "swscale-10.dll", "swresample-7.dll")

          $missing = $required | Where-Object { -not (Test-Path (Join-Path $binDir $_)) }
          if ($missing.Count -eq 0) {
              Write-Output "All required FFmpeg runtime DLLs already exist in $binDir"
              exit 0
          }

          Write-Output "Downloading FFmpeg shared runtime DLLs from $env:FFMPEG_DOWNLOAD_URL"
          $zipPath = Join-Path $env:RUNNER_TEMP "ffmpeg-shared.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "ffmpeg-shared"

          curl.exe -fSL --retry 3 --retry-delay 5 -o $zipPath $env:FFMPEG_DOWNLOAD_URL
          if ($LASTEXITCODE -ne 0) {
              Write-Output "::error::Failed to download FFmpeg shared build archive"
              exit 1
          }

          if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force

          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          foreach ($dll in $required) {
              $found = Get-ChildItem -Path $extractDir -Filter $dll -Recurse -File | Select-Object -First 1
              if (-not $found) {
                  Write-Output "::error::Required FFmpeg runtime DLL '$dll' was not found in downloaded archive"
                  exit 1
              }
              Copy-Item -Path $found.FullName -Destination (Join-Path $binDir $dll) -Force
              Write-Output "Staged $dll ($($found.Length) bytes)"
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build OsmiumEngine (SDL3 + Opus + Native Engine)
        run: msbuild native\osmium-engine\OsmiumEngine.vcxproj /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=x64

      - name: Verify native runtime outputs
        shell: pwsh
        run: |
          $outDir = "native\bin\x64\${{ env.BUILD_CONFIGURATION }}"
          $requiredFiles = @(
              "OsmiumEngine.dll",
              "SDL3.dll",
              "avcodec-63.dll",
              "avutil-61.dll",
              "swscale-10.dll",
              "swresample-7.dll",
              "gamecontrollerdb.txt",
              "drivers\usbip2_ude\usbip2_ude.sys"
          )
          foreach ($rel in $requiredFiles) {
              $full = Join-Path $outDir $rel
              if (-not (Test-Path $full)) {
                  Write-Output "::error::Missing native runtime file: $full"
                  exit 1
              }
              Write-Output "Verified $full"
          }

      - name: Upload native build output
        uses: actions/upload-artifact@v4
        with:
          name: native-build
          path: native/bin/x64/${{ env.BUILD_CONFIGURATION }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build-app:
    name: Build Osmium.App
    needs: [prepare, build-native]
    runs-on: windows-latest
    outputs:
      output_dir: ${{ steps.locate.outputs.output_dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download native build output
        uses: actions/download-artifact@v4
        with:
          name: native-build
          path: native/bin/x64/${{ env.BUILD_CONFIGURATION }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Osmium.App
        run: dotnet build src\Osmium.App\Osmium.App.csproj -c ${{ env.BUILD_CONFIGURATION }} /p:Platform="x64"

      - name: Locate and verify build output directory
        id: locate
        shell: pwsh
        run: |
          $dir = Get-ChildItem -Path "src\Osmium.App\bin" -Recurse -Directory |
                 Where-Object {
                     $_.FullName -match "${{ env.BUILD_CONFIGURATION }}" -and
                     $_.FullName -match "net8.0-windows" -and
                     (Test-Path (Join-Path $_.FullName "Osmium.exe"))
                 } |
                 Select-Object -First 1
          if (-not $dir) {
              Write-Output "::error::Failed to locate Osmium.App build output directory containing Osmium.exe"
              exit 1
          }

          $requiredFiles = @(
              "Osmium.exe",
              "OsmiumEngine.dll",
              "SDL3.dll",
              "avcodec-63.dll",
              "avutil-61.dll",
              "swscale-10.dll",
              "swresample-7.dll",
              "gamecontrollerdb.txt",
              "drivers\usbip2_ude\usbip2_ude.sys"
          )
          foreach ($rel in $requiredFiles) {
              $full = Join-Path $dir.FullName $rel
              if (-not (Test-Path $full)) {
                  Write-Output "::error::Missing required app output file: $full"
                  exit 1
              }
          }

          $relPath = [System.IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $dir.FullName).Replace('\', '/')
          "output_dir=$relPath" >> $env:GITHUB_OUTPUT
          Write-Output "Build output directory: $relPath"

      - name: Upload app build output
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: ${{ steps.locate.outputs.output_dir }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  package-installer:
    name: Package Installer
    needs: [prepare, build-app]
    runs-on: windows-latest
    outputs:
      exe_name: ${{ steps.meta.outputs.exe_name }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    env:
      OUTPUT_DIR: ${{ needs.build-app.outputs.output_dir }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download app build output
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: ${{ env.OUTPUT_DIR }}

      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
              choco install innosetup --no-progress -y
          }

      - name: Compile Inno Setup script
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Osmium.Installer\setup.iss'

      - name: Stage installer artifact
        id: meta
        shell: pwsh
        run: |
          $exeFile = Get-ChildItem -Path "Osmium.Installer\installer" -Filter "*.exe" | Select-Object -First 1
          if (-not $exeFile) {
              Write-Output "::error::No installer executable found in Osmium.Installer\installer"
              exit 1
          }

          $shortSha = "${{ needs.prepare.outputs.short_sha }}"
          $version = "${{ needs.prepare.outputs.version }}"
          $newExeName = "$($exeFile.BaseName)-${shortSha}.exe"
          $artifactName = "Osmium-Installer-v${version}-${shortSha}"

          New-Item -ItemType Directory -Force -Path installer-staging | Out-Null
          Move-Item -LiteralPath $exeFile.FullName -Destination "installer-staging\$newExeName" -Force

          "exe_name=$newExeName" >> $env:GITHUB_OUTPUT
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT

          "### Installer Build Successful" >> $env:GITHUB_STEP_SUMMARY
          "- **Version**: ``v$version``" >> $env:GITHUB_STEP_SUMMARY
          "- **Commit**: ``$shortSha``" >> $env:GITHUB_STEP_SUMMARY
          "- **Generated Installer**: **$newExeName**" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: installer-staging/*.exe
          if-no-files-found: error

  package-portable:
    name: Package Portable ZIP
    needs: [prepare, build-app]
    runs-on: ubuntu-latest
    outputs:
      zip_name: ${{ steps.pack.outputs.zip_name }}
      artifact_name: ${{ steps.pack.outputs.artifact_name }}
    steps:
      - name: Download app build output
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: portable

      - name: Clean debug symbols and create portable ZIP
        id: pack
        shell: bash
        run: |
          find portable -type f \( -name "*.pdb" -o -name "*.lib" -o -name "*.exp" -o -name "*.xml" \) -delete
          find portable -maxdepth 1 -name "BuildHost-*" -exec rm -rf {} +
          find portable -type d -name "obj" -exec rm -rf {} +

          version="${{ needs.prepare.outputs.version }}"
          short_sha="${{ needs.prepare.outputs.short_sha }}"
          zip_name="Osmium-Portable-v${version}-${short_sha}.zip"
          artifact_name="Osmium-Portable-v${version}-${short_sha}"

          (cd portable && zip -r -9 "../${zip_name}" .)

          echo "zip_name=${zip_name}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          ls -lh "${zip_name}"

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.artifact_name }}
          path: Osmium-Portable-*.zip
          if-no-files-found: error

  summary:
    name: Pipeline Summary
    if: always()
    needs:
      - prepare
      - build-native
      - build-app
      - package-installer
      - package-portable
    runs-on: ubuntu-latest
    steps:
      - name: Write pipeline summary
        shell: bash
        env:
          R_PREPARE: ${{ needs.prepare.result }}
          R_NATIVE: ${{ needs.build-native.result }}
          R_APP: ${{ needs.build-app.result }}
          R_INSTALLER: ${{ needs.package-installer.result }}
          R_PORTABLE: ${{ needs.package-portable.result }}
          SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          INSTALLER_ARTIFACT: ${{ needs.package-installer.outputs.artifact_name }}
          PORTABLE_ARTIFACT: ${{ needs.package-portable.outputs.artifact_name }}
        run: |
          cls() {
            case "$1" in
              success)   echo "ok" ;;
              failure)   echo "failed" ;;
              cancelled) echo "cancelled" ;;
              *)         echo "skipped" ;;
            esac
          }

          {
            echo "## Pipeline Summary"
            echo ""
            echo "- **Version**: \`v${VERSION:-unknown}\`"
            echo "- **Commit**: \`${SHA:-unknown}\`"
            if [ -n "$INSTALLER_ARTIFACT" ]; then
              echo "- **Installer Artifact**: \`${INSTALLER_ARTIFACT}\`"
            fi
            if [ -n "$PORTABLE_ARTIFACT" ]; then
              echo "- **Portable Artifact**: \`${PORTABLE_ARTIFACT}\`"
            fi
            echo ""
            echo '```mermaid'
            echo 'flowchart LR'
            echo '  P[Prepare] --> N[Build OsmiumEngine]'
            echo '  N --> A[Build Osmium.App]'
            echo '  A --> I[Package Installer]'
            echo '  A --> Z[Package Portable ZIP]'
            echo '  classDef ok fill:#2da44e,stroke:#1a7f37,color:#ffffff'
            echo '  classDef failed fill:#cf222e,stroke:#a40e26,color:#ffffff'
            echo '  classDef cancelled fill:#9a6700,stroke:#7d4e00,color:#ffffff'
            echo '  classDef skipped fill:#8c959f,stroke:#6e7781,color:#ffffff'
            echo "  class P $(cls "$R_PREPARE")"
            echo "  class N $(cls "$R_NATIVE")"
            echo "  class A $(cls "$R_APP")"
            echo "  class I $(cls "$R_INSTALLER")"
            echo "  class Z $(cls "$R_PORTABLE")"
            echo '```'
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Prepare | ${R_PREPARE} |"
            echo "| Build OsmiumEngine | ${R_NATIVE} |"
            echo "| Build Osmium.App | ${R_APP} |"
            echo "| Package Installer | ${R_INSTALLER} |"
            echo "| Package Portable ZIP | ${R_PORTABLE} |"
          } >> "$GITHUB_STEP_SUMMARY"
